services:
  embyradar:
    image: ${EMBYRADAR_IMAGE:-lfy1680/embyradar:beta}
    container_name: embyradar
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    ports:
      - "8088:8080"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
